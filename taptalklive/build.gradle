import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'kotlin-parcelize'
    id 'maven-publish'
}

if (file("${rootProject.rootDir}/environment.properties").exists()) {
    apply from: "${rootProject.rootDir}/environment.properties"
}

android {
    namespace = "io.taptalk.taptalklive"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        targetSdk = 36
        versionCode = taptalklive_version_code
        versionName = taptalklive_version_name
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles("proguard-rules.pro")
    }

    buildTypes {
        release {
            minifyEnabled = true
            debuggable = false
            consumerProguardFiles("proguard-rules.pro")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_TAPLIVE_SDK_BASE_URL')) {
                buildConfigField("String", "TAPLIVE_SDK_BASE_URL", "\"${RELEASE_TAPLIVE_SDK_BASE_URL}\"")
            }
            else {
                buildConfigField("String", "TAPLIVE_SDK_BASE_URL", "\"\"")
            }
        }
        staging {
            minifyEnabled = false
            debuggable = true
            consumerProguardFiles("proguard-rules.pro")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('STAGING_TAPLIVE_SDK_BASE_URL')) {
                buildConfigField("String", "TAPLIVE_SDK_BASE_URL", "\"${STAGING_TAPLIVE_SDK_BASE_URL}\"")
            }
            else {
                buildConfigField("String", "TAPLIVE_SDK_BASE_URL", "\"\"")
            }
        }
        dev {
            minifyEnabled = false
            debuggable = true
            consumerProguardFiles("proguard-rules.pro")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('DEV_TAPLIVE_SDK_BASE_URL')) {
                buildConfigField("String", "TAPLIVE_SDK_BASE_URL", "\"${DEV_TAPLIVE_SDK_BASE_URL}\"")
            }
            else {
                buildConfigField("String", "TAPLIVE_SDK_BASE_URL", "\"\"")
            }
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    publishing {
        singleVariant("release") {
            withJavadocJar()
            withSourcesJar()
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation(fileTree(dir: 'libs', include: ['*.jar']))

    implementation("androidx.appcompat:appcompat:1.7.1")
    implementation("androidx.constraintlayout:constraintlayout:2.2.2")
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version")
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")

    // Latest available version for minSdk 21
    //noinspection GradleDependency
    implementation("androidx.core:core-ktx:1.17.0")
    //noinspection GradleDependency
    implementation("com.google.android.material:material:1.13.0")
    //noinspection GradleDependency
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4")

    // TapTalk
    api("com.github.taptalk-io:taptalk.io-android:2.19.0-7")

    // Lifecycle components
    api("androidx.lifecycle:lifecycle-extensions:2.2.0")

    // Jackson
    implementation("com.fasterxml.jackson.core:jackson-core:2.22.1")
    implementation("com.fasterxml.jackson.core:jackson-annotations:2.22")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.22.1")

    // GMS
    implementation("com.google.android.gms:play-services-vision:20.1.3")
    //noinspection GradleDependency
    implementation("com.google.android.gms:play-services-maps:19.0.0")
    //noinspection GradleDependency
    implementation("com.google.android.libraries.places:places:2.6.0")

    // Glide
    //noinspection NewerVersionAvailable
    implementation("com.github.bumptech.glide:glide:4.11.0")
    //noinspection NewerVersionAvailable
    annotationProcessor("com.github.bumptech.glide:compiler:4.11.0")

    // OKHTTP
    implementation("com.squareup.okhttp3:okhttp:5.4.0")
    implementation("com.squareup.okhttp3:logging-interceptor:5.4.0")

    // Retrofit
    implementation("com.squareup.retrofit2:retrofit:3.0.0")
    implementation("com.squareup.retrofit2:converter-jackson:3.0.0")
    implementation("com.squareup.retrofit2:adapter-rxjava:3.0.0")

    // RxAndroid
    implementation("io.reactivex:rxandroid:1.2.1")
    implementation("io.reactivex:rxjava:1.3.8")

    // Stetho
    implementation("com.facebook.stetho:stetho:1.6.0")
    implementation("com.facebook.stetho:stetho-okhttp3:1.6.0")

    // Firebase
    implementation("com.google.firebase:firebase-core:21.1.1")
    //noinspection GradleDependency
    implementation("com.google.firebase:firebase-messaging:23.4.1")
}

tasks.register('androidSourcesJar', Jar) {
    archiveClassifier.set("sources")
    from android.sourceSets.main.java.srcDirs
}

project.afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.taptalk-io'
                artifactId = 'taptalk.io-omnichannel-android'
                version = "$taptalklive_version_name"
                generateMetadataFileForReleasePublication.dependsOn androidSourcesJar
            }
        }
    }
}
